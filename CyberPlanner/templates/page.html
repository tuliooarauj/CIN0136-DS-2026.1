<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPlanner - IA</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

<div class="app-layout">
    <div class="chat-container">
        <div class="header">
            <div class="header-icon">🗓</div>
            <div class="header-text">
                <h1>CyberPlanner</h1>
                <p>Gestor de Rotina com IA</p>
            </div>
            <button id="toggle-calendar-btn" onclick="toggleCalendar()" title="Ver Calendário">📅</button> 
            <button id="btn-logout" class="btn-logout">Sair</button>
            <div class="status-dot" title="Online"></div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message-row">
                <div class="avatar ai">CP</div>
                <div class="bubble ai-msg">Olá! Sou o <strong>CyberPlanner</strong>, seu gestor de rotina inteligente. Me conte seus compromissos, horários e preferências — vou organizar tudo sem conflitos e gerar sua tabela de rotina.</div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ex: Tenho aula às 8h, academia às 18h..." autocomplete="off">
            <button id="send-btn" onclick="enviarMensagem()" title="Enviar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <div class="calendar-sidebar" id="calendar-sidebar">
        <div class="calendar-header">
            <div class="sidebar-top">
                <h2>Calendário de Rotinas</h2>
                <div class="view-switcher">
                    <button id="view-day-btn" class="switch-btn active" onclick="alternarVisualizacao('dia')">Dia</button>
                    <button id="view-month-btn" class="switch-btn" onclick="alternarVisualizacao('mes')">Mês</button>
                </div>
            </div>
            
            <div class="days-tabs" id="days-tabs-container">
                <button class="tab-btn active" onclick="mudarDia('Seg', event)">S</button>
                <button class="tab-btn" onclick="mudarDia('Ter', event)">T</button>
                <button class="tab-btn" onclick="mudarDia('Qua', event)">Q</button>
                <button class="tab-btn" onclick="mudarDia('Qui', event)">Q</button>
                <button class="tab-btn" onclick="mudarDia('Sex', event)">S</button>
                <button class="tab-btn" onclick="mudarDia('Sáb', event)">S</button>
                <button class="tab-btn" onclick="mudarDia('Dom', event)">D</button>
            </div>
        </div>
        
        <div class="calendar-body">
            <div id="calendar-content-area">
                </div>
        </div>
    </div>
</div>

<script src="../static/js/index.js"></script>
</body>
</html>
