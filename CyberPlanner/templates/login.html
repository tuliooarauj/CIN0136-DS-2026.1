<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPlanner - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-icon">🗓</div>
                <h2>CyberPlanner</h2>
                <p>Gestor de Rotina com IA</p>
            </div>
            
            <div class="input-group">
                <label for="username">E-mail</label>
                <input type="email" id="username" placeholder="Digite seu e-mail" autocomplete="off" required>
            </div>
            
            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            
            <div class="login-actions">
                <button id="btn-entrar" class="btn-primary">Entrar</button>
                <button id="btn-cadastrar" class="btn-secondary">Cadastrar</button>
            </div>
            
            <p id="mensagem-erro" class="error-msg" style="display: none;"></p>
        </div>
    </div>

    <script src="../static/js/login.js"></script>
</body>
</html>
