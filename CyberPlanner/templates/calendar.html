<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calendário Mensal</title>
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>

<div class="container">

    <div class="header">
        <button id="prevMonth">&lt;</button>

        <h1 id="monthYear"></h1>

        <button id="nextMonth">&gt;</button>
    </div>

    <div class="weekdays">
        <div>Dom</div>
        <div>Seg</div>
        <div>Ter</div>
        <div>Qua</div>
        <div>Qui</div>
        <div>Sex</div>
        <div>Sáb</div>
    </div>

    <div id="calendar" class="calendar-grid"></div>

</div>

<script src="/static/js/calendar.js"></script>

</body>
</html>
